# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=edificio"
      JWT_SECRET: "ci_dummy_secret_solo_para_build_no_usar_en_produccion"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
      SESSION_IDLE_TIMEOUT_MINUTES: "30"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm db:generate

      - name: Lint (todos los paquetes)
        run: pnpm lint

      - name: Build (todos los paquetes)
        run: pnpm build