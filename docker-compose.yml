# docker-compose.yml
# Orquestación de servicios en contenedores (PostgreSQL)

services:
  db:
    image: postgres:17-alpine
    container_name: edificio_xyz_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./database/migrations/002_agregar_id_persona_usuarios.sql:/docker-entrypoint-initdb.d/002_agregar_id_persona_usuarios.sql
      - ./database/migrations/003_modulos_deseables.sql:/docker-entrypoint-initdb.d/003_modulos_deseables.sql

volumes:
  postgres_data:
