# docker-compose.yml
# Orquestación de servicios en contenedores (PostgreSQL)

services:
  db:
    image: postgres:17-alpine
    container_name: edificio_xyz_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./database/migrations/002_initial_data.sql:/docker-entrypoint-initdb.d/002_initial_data.sql
      - ./database/migrations/003_expensas_agua_sesiones_pagos.sql:/docker-entrypoint-initdb.d/003_expensas_agua_sesiones_pagos.sql
      - ./database/migrations/004_montos_agua_manuales.sql:/docker-entrypoint-initdb.d/004_montos_agua_manuales.sql
      - ./database/migrations/005_movimientos_ingresos_egresos.sql:/docker-entrypoint-initdb.d/005_movimientos_ingresos_egresos.sql
      - ./database/migrations/006_caja_bancos_conciliacion.sql:/docker-entrypoint-initdb.d/006_caja_bancos_conciliacion.sql

volumes:
  postgres_data:
